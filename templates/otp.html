<!DOCTYPE html>
<html>

<head>
    <title>Verify OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 100px auto;
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #444;
            line-height: 1.5;
        }

        .error {
            color: #e74c3c;
            background: #fdecea;
            border-radius: 6px;
            padding: 10px;
            margin: 16px 0;
        }

        form {
            margin-top: 24px;
        }

        input[type="text"] {
            padding: 10px;
            width: 200px;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            display: block;
            margin: 16px auto 0;
            padding: 12px 28px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4752C4;
        }
    </style>
</head>

<body>
    <h1>Enter Your Code</h1>
    <p>We sent a 6-digit code to your email. It expires in 10 minutes.</p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form action="/auth/verify-otp" method="POST">
        <input type="hidden" name="discord_id" value="{{ discord_id }}">
        <input type="hidden" name="email" value="{{ email }}">
        <input type="text" name="otp" placeholder="123456" required pattern="\d{6}" maxlength="6">
        <button type="submit">Verify</button>
    </form>
</body>

</html>

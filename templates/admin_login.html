<!DOCTYPE html>
<html>

<head>
    <title>Admin Login — CampusGuide</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0f1115;
            color: #e6e6e6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        form {
            background: #1a1d24;
            padding: 32px;
            border-radius: 12px;
            width: 280px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0f1115;
            color: #e6e6e6;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #5865F2;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            color: #f87171;
            font-size: 14px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <form method="post" action="/admin/login">
        <h1>CampusGuide Admin</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="password" name="password" placeholder="Password" required autofocus>
        <button type="submit">Log in</button>
    </form>
</body>

</html>

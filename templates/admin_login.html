<!DOCTYPE html>
<html>

<head>
    <title>Admin Login — CampusGuide</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0f1115;
            color: #e6e6e6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        form {
            background: #1a1d24;
            padding: 32px;
            border-radius: 12px;
            width: 280px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0f1115;
            color: #e6e6e6;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #5865F2;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            color: #f87171;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 0;
            bottom: 12px;
            width: auto;
            padding: 0 6px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover {
            color: #e6e6e6;
        }
    </style>
</head>

<body>
    <form method="post" action="/admin/login">
        <h1>CampusGuide Admin</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="password-wrapper">
            <input type="password" name="password" id="password" placeholder="Password" required autofocus>
            <button type="button" class="toggle-password" id="toggleBtn">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
        <button type="submit">Log in</button>
    </form>

    <script>
        const input = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        const btn = document.getElementById('toggleBtn');

        const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
        const eyeOff = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

        btn.addEventListener('click', function () {
            const currentlyHidden = input.type === 'password';
            input.type = currentlyHidden ? 'text' : 'password';
            icon.innerHTML = currentlyHidden ? eyeOff : eyeOpen;
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>CampusGuide Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 100px auto;
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #444;
            line-height: 1.5;
        }

        .discord-button {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .discord-button:hover {
            background-color: #4752C4;
        }
    </style>
</head>

<body>
    <h1>Welcome to CampusGuide</h1>
    <p>Verify your IITM email to unlock the full Discord server.</p>
    <a class="discord-button" href="/auth/login">Login with Discord</a>
</body>

</html>
